schema_version: 4
name: fig4-nonresponder-dynamics
title: "Fig 4 — responder vs non-responder dynamics"
created: '2026-11-05'
status: ran
execution_status: completed
verdict: qualified
phase: Evaluate
question: >-
  Under a single fixed multi-stage intervention, does the in-silico population
  split into responders (heal) and non-responders (still die), and do the
  non-responders show the paper's hallmark — a hyper-productive GCSF/neutrophil
  response that compounds inflammation?
experiment: >-
  Run 40 replicates untreated and 40 under the digitized Fig-2 intervention.
  Split the treated runs into responders / non-responders and compare the
  responder-average vs a representative non-responder for oxygen deficit, total
  GCSF, and neutrophil population. Reproduces Fig 4A-C.
baseline:
- name: treated
  composite: viva_iirabm.composites.sepsis.iirabm_treated
  params: {intervention: fig2_digitized}
variants:
- name: untreated
  composite: viva_iirabm.composites.sepsis.iirabm_baseline
  params: {}
behavior_tests:
- name: responders-and-nonresponders
  classification: primary
  description: >-
    The fixed intervention lowers mortality below baseline yet leaves a nonzero
    population of non-responders (patients who still die under treatment). Pass
    if at least one non-responder exists.
  measure:
    kind: derived_scalar
    field: n_nonresponders
  pass_if:
    op: '>'
    value: 0
  requires_simulation: treated
pipeline_gate:
  prerequisites: [fig6-stochastic-trajectories]
  enables: []
canonical_runs:
- name: default
  script: workspace/studies/fig4-nonresponder-dynamics/sims/run.py
  args: []
  label: fig4-nonresponder-dynamics
  default: true
visualizations:
- name: nonresponder-dynamics
  view: mechanism
  path: viz/nonresponder-dynamics.html
  status: ready
  description: >-
    Three panels (oxygen deficit, total GCSF, neutrophil population) overlaying
    the responder average (blue) and a non-responder (red) — reproduction of Fig 4.
findings: []
confidence: Medium
report:
  verdict: >-
    Non-responder phenomenon reproduced (population splits 5 responders / 35
    non-responders). The digitized intervention itself is not beneficial at the
    population level — a digitization/approximation limitation, not a failure of
    the model — so this study supports the non-responder claim but not a
    mortality reduction from the digitized genome.
result: "5 responders, 35 non-responders (primary test n_nonresponders > 0 PASSES); treated 88% vs baseline 80% mortality."
